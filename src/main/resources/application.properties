spring.application.name=commute-yaching-api
#spring.datasource.url=jdbc:mariadb://localhost:3306/commute_yaching
spring.datasource.url=jdbc:mariadb://localhost:3307/commute_yaching
spring.datasource.username=root
spring.datasource.password=1234


#spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# 1. Hibernate 커넥션 풀 로그 활성화 (질문하신 로그 출력)
logging.level.org.hibernate.orm.connections.pooling=INFO

# 2. HikariCP 자체 상세 설정 로그 활성화 (풀 크기, 상태 등 상세 정보 출력)
logging.level.com.zaxxeon.hikari=DEBUG

# 3. 드라이버 클래스명 명시 (Database driver: undefined/unknown 해제)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

